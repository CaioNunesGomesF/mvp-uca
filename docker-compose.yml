services:
  db:
    image: postgres:15-alpine
    container_name: uca_db
    restart: always
    environment:
      POSTGRES_USER: uca_admin
      POSTGRES_PASSWORD: uca_password
      POSTGRES_DB: uca_game
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: uca_backend
    restart: always
    ports:
      - "3002:3002"
    depends_on:
      - db
    volumes:
      - ./backend/database.sqlite:/app/database.sqlite
    environment:
      NODE_ENV: production

  frontend:
    build: ./frontend
    container_name: uca_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
